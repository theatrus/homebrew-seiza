name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Tap this repository
        run: brew tap theatrus/seiza "https://github.com/${GITHUB_REPOSITORY}"

      - name: Check out the pushed revision into the tap
        run: |
          cd "$(brew --repository theatrus/seiza)"
          git fetch origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA"

      - name: Audit formula and cask style
        run: |
          brew style theatrus/seiza
          brew audit --tap theatrus/seiza

      - name: Check whether the formula changed
        id: formula
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tap_directory="$(brew --repository theatrus/seiza)"
          git -C "$tap_directory" fetch origin "$BASE_SHA"
          if git -C "$tap_directory" diff --quiet \
            "$BASE_SHA" "$GITHUB_SHA" -- Formula/seiza.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test the formula
        if: steps.formula.outputs.changed == 'true'
        run: |
          brew install --build-from-source theatrus/seiza/seiza
          brew test theatrus/seiza/seiza
